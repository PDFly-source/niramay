name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: AI engine tests (115 checks)
        run: npm run test:ai

      - name: Production build (includes type checking)
        env:
          NEXT_PUBLIC_BASE_PATH: /niramay
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
